# 只在手动触发时构建 release APK 并挂到 GitHub Release 上。
#
# 触发器只有 workflow_dispatch 一个：**任何 push 都不会构建、不会发布**。
# 要出包时，先在 app/build.gradle.kts 里改好 versionName / versionCode 并 push，
# 然后到 Actions 页面手动 Run workflow（或 `gh workflow run release.yml`）。
#
# tag 不手填，由代码里的 versionName 推出来（`v3.3`），保证「Release 的名字」与
# 「APK 里印的版本」永远一致；tag 已存在就直接失败，不会悄悄覆盖已发布的包。
name: Release APK

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # 给 gh 用：Actions 里 GITHUB_TOKEN 不会自动变成 GH_TOKEN，gh 只认后者，必须显式给。
    # GH_REPO 也一起钉住，免得 gh 依赖当前工作目录去猜仓库。
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      # 守护进程 JDK 被 gradle/gradle-daemon-jvm.properties 钉在 25；这里必须给同一个大版本。
      - name: 装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # compileSdk 37 要 platforms;android-37.0（本机平台目录就叫这个名），
      # 运行器镜像不保证带这一档，所以显式装；build-tools 给一个兜底版本。
      #
      # 不写 `set -o pipefail`：给 sdkmanager 喂许可证要用 `yes ... |`，这个管道必然以
      # SIGPIPE（141）收尾，开着 pipefail 会把整步判失败。所以要挡的是最后那句目录检查。
      - name: 装 Android SDK 平台
        run: |
          set -eu
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            yes | sdkmanager "platforms;android-37.0" "build-tools;36.1.0"
          fi
          test -d "$ANDROID_HOME/platforms/android-37.0"

      # 版本号只在这一步落到 $GITHUB_ENV（小写 version_name / tag），后面的 step 一律用
      # `${{ env.* }}` 取：**shell 变量跨 step 不存在**（踩过：拿到空串，产物名变成 UnlockAssistant--release.apk）。
      - name: 从 versionName 推出版本号
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_ENV"
          echo "本次要发布的版本：v$VERSION_NAME"

      - name: 构建 release APK
        run: |
          # Windows 上提交的仓库容易丢掉 gradlew 的可执行位（clone 出来是 644 → "./gradlew: Permission denied"，exit 126），
          # 所以这里先补一次，别指望仓库里的 mode 一定对。
          chmod +x gradlew
          # gradle.properties 在本机写的是 D:/jdk-* 那种 Windows 路径，在 Linux 上解析不到，
          # 所以这里用同一个属性覆盖成运行器上的 JDK 25（否则守护进程会去联网下一份 JDK）。
          ./gradlew --no-daemon --console=plain assembleRelease \
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME"
          test -f app/build/outputs/apk/release/app-release.apk
          # release 与 debug 用同一把密钥签名（keystore/ 随源码进 Git），
          # 只是 release 不带 debuggable，便于长期安装使用。
          # 文件名用 ${{ env.* }} 而不是 shell 变量：跨 step 的 shell 变量不存在（踩过：拿到空串）。
          APK_NAME='app/build/outputs/apk/release/UnlockAssistant-${{ env.version_name }}-release.apk'
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          ls -l "$APK_NAME"

      - name: 校验签名
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --min-sdk-version 21 --verbose app/build/outputs/apk/release/app-release.apk
          echo "SHA256: $(sha256sum app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1)"

      - name: 建 Release（草稿）
        run: |
          set -euo pipefail
          TAG='${{ env.tag }}'
          VERSION='${{ env.version_name }}'
          # 路径在这里自己拼：前一步写进 $GITHUB_ENV 的值，在**同一个 step 的 `${{ env.* }}` 里取不到**。
          APK="app/build/outputs/apk/release/UnlockAssistant-$VERSION-release.apk"
          # ${{ env.* }} 由 GitHub 自己代入（跨 step 可靠）；shell 变量跨 step 会取到空值。
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::tag $TAG 已经存在，先改 versionName 再触发"
            exit 1
          fi
          printf '%s\n' \
            "由 GitHub Actions 手动触发构建（不随 push 自动发布）。" \
            "" \
            "- 版本：$VERSION" \
            "- 触发提交：\`$GITHUB_SHA\`" \
            "- 签名：与本地构建同一把自签名密钥（v1 + v2 + v3 全开）" \
            "" \
            "这是**草稿**，确认无误后再手动 Publish。" > release-notes.md
          gh release create "$TAG" "$APK" \
            --title "开锁 $VERSION" \
            --notes-file release-notes.md \
            --draft
